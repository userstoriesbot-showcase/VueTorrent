# Showcase fork only (never part of an upstream pull request).
version: 1
app:
  install: "npm ci --include=dev && npx vite build -m demo"
  start: npx vite preview -m demo --port {port} --strictPort --host 0.0.0.0
  url: http://localhost:{port}
  readyPath: /
  readyStatus: 200
  runtime: node24
demo:
  maxVideos: 1
  beforePass: true
